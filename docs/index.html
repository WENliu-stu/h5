<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>个人微信名片</title>
    <style>
        /* ===== 全局重置 & 基础样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(145deg, #e8f0fe 0%, #f5f7fa 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ===== 名片卡片 ===== */
        .card {
            width: 100%;
            max-width: 380px;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08), 0 8px 24px rgba(0, 0, 0, 0.04);
            padding: 40px 28px 35px;
            text-align: center;
            transition: transform 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        /* 顶部装饰光晕 */
        .card::before {
            content: '';
            position: absolute;
            top: -60px;
            right: -60px;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(7, 193, 96, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        /* ===== 头像 ===== */
        .avatar-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 16px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ffffff;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            background-color: #f0f2f5;
            display: block;
        }

        /* 微信绿色状态标识 */
        .status-dot {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 22px;
            height: 22px;
            background: #07c160;
            border-radius: 50%;
            border: 3px solid #ffffff;
            box-shadow: 0 2px 8px rgba(7, 193, 96, 0.3);
        }

        /* ===== 姓名 & 标题 ===== */
        .name {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a2e;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .title {
            font-size: 15px;
            color: #888;
            font-weight: 400;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        /* ===== 分割线 ===== */
        .divider {
            width: 50px;
            height: 3px;
            background: linear-gradient(90deg, #07c160, #06ad56);
            border-radius: 10px;
            margin: 0 auto 20px;
        }

        /* ===== 个人信息列表 ===== */
        .info-list {
            list-style: none;
            text-align: left;
            margin-bottom: 26px;
        }

        .info-list li {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
            color: #333;
        }

        .info-list li:last-child {
            border-bottom: none;
        }

        .info-list .label {
            width: 58px;
            color: #999;
            font-weight: 400;
            flex-shrink: 0;
        }

        .info-list .value {
            color: #1a1a2e;
            word-break: break-all;
        }

        .info-list .value a {
            color: #07c160;
            text-decoration: none;
        }

        .info-list .value a:hover {
            text-decoration: underline;
        }

        /* ===== 二维码区域 ===== */
        .qr-section {
            background: #f8fafc;
            border-radius: 20px;
            padding: 20px 20px 16px;
            margin-bottom: 22px;
            border: 1px dashed #dce3ec;
        }

        .qr-section .qr-label {
            font-size: 13px;
            color: #888;
            margin-bottom: 12px;
            letter-spacing: 2px;
        }

        .qr-code {
            width: 160px;
            height: 160px;
            margin: 0 auto;
            display: block;
            background: #ffffff;
            border-radius: 12px;
            padding: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }

        .qr-tip {
            font-size: 12px;
            color: #aaa;
            margin-top: 10px;
            letter-spacing: 0.3px;
        }

        .qr-tip span {
            color: #07c160;
            font-weight: 600;
        }

        /* ===== 底部按钮 ===== */
        .btn-wechat {
            display: inline-block;
            width: 100%;
            padding: 14px 0;
            background: #07c160;
            color: #ffffff;
            font-size: 17px;
            font-weight: 600;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            text-decoration: none;
            letter-spacing: 1px;
            transition: background 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 16px rgba(7, 193, 96, 0.25);
        }

        .btn-wechat:hover {
            background: #06ad56;
        }

        .btn-wechat:active {
            transform: scale(0.97);
        }

        /* ===== 页脚 ===== */
        .footer {
            margin-top: 18px;
            font-size: 11px;
            color: #c0c8d4;
            letter-spacing: 1px;
        }

        /* ===== 响应式优化 ===== */
        @media (max-width: 420px) {
            .card {
                padding: 30px 18px 25px;
                border-radius: 24px;
            }
            .avatar {
                width: 80px;
                height: 80px;
            }
            .qr-code {
                width: 140px;
                height: 140px;
            }
            .info-list li {
                font-size: 13px;
                padding: 8px 0;
            }
        }
    </style>
</head>
<body>

    <div class="card">

        <!-- ===== 头像 ===== -->
        <div class="avatar-wrapper">
            <!-- 
                ⚠️ 替换头像：将下面 src 的链接换成你自己的头像图片URL
                推荐使用 1:1 正方形图片，建议尺寸 200x200 以上
            -->
            <img class="avatar" 
                 src="https://via.placeholder.com/200/07c160/ffffff?text=Avatar" 
                 alt="头像">
            <div class="status-dot"></div>
        </div>

        <!-- ===== 姓名 & 职位 ===== -->
        <h1 class="name">张小明</h1>
        <p class="title">高级产品经理 · 互联网</p>

        <div class="divider"></div>

        <!-- ===== 个人信息 ===== -->
        <ul class="info-list">
            <li>
                <span class="label">📱 手机</span>
                <span class="value"><a href="tel:+8613912345678">139 1234 5678</a></span>
            </li>
            <li>
                <span class="label">📧 邮箱</span>
                <span class="value"><a href="mailto:zhangxm@example.com">zhangxm@example.com</a></span>
            </li>
            <li>
                <span class="label">🏢 公司</span>
                <span class="value">XX科技有限公司</span>
            </li>
        </ul>

        <!-- ===== 微信二维码 ===== -->
        <div class="qr-section">
            <div class="qr-label">— 微信扫一扫 · 联系我 —</div>
            <!-- 
                ⚠️ 替换二维码：将下面 src 的链接换成你的个人微信二维码图片URL
                建议尺寸 300x300 以上，清晰即可
            -->
            <img class="qr-code" 
                 src="https://api.qrserver.com/v1/create-qr-code/?data=https://example.com&size=300x300&bgcolor=ffffff&color=07c160" 
                 alt="微信二维码">
            <p class="qr-tip">👆 长按识别二维码 · 添加微信好友</p>
        </div>

        <!-- ===== 添加按钮 ===== -->
        <a href="weixin://" class="btn-wechat">📲 打开微信添加</a>

        <!-- ===== 页脚 ===== -->
        <div class="footer">—— 电子名片 · 欢迎交流 ——</div>

    </div>

</body>
